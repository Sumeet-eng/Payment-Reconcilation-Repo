name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-reconciliation-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: payment-reconciliation-system/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Docker image builds
        run: docker build -t payment-reconciliation .
